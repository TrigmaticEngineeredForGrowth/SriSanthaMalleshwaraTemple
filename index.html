<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shanta Malleshwara Swami — Sacred Temple of Cosmic Shiva</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap">

<style>
  :root {
    --bg-0: #050505;
    --bg-1: #0B1120;
    --bg-2: #131a2c;
    --gold: #FF7A2E;
    --gold-soft: #d96218;
    --gold-glow: rgba(255, 122, 46, 0.38);
    --ivory: #F5F5F5;
    --ivory-dim: rgba(245, 245, 245, 0.72);
    --ivory-faint: rgba(245, 245, 245, 0.42);
    --line: rgba(255, 122, 46, 0.18);
    --line-soft: rgba(245, 245, 245, 0.08);
    --blue-glow: rgba(120, 190, 255, 0.35);

    --f-display: "Cinzel", serif;
    --f-serif: "Cormorant Garamond", "Playfair Display", serif;
    --f-script: "Playfair Display", serif;
    --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --f-sanskrit: "Tiro Devanagari Sanskrit", serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--ivory); }
  body {
    font-family: var(--f-serif);
    font-weight: 400;
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  ::selection { background: var(--gold); color: var(--bg-0); }

  /* Reusable */
  .container { max-width: 1280px; margin: 0 auto; padding: 0 48px; }
  .container-narrow { max-width: 920px; margin: 0 auto; padding: 0 48px; }

  .eyebrow {
    font-family: var(--f-display);
    font-size: 11px;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 14px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ""; display: inline-block; width: 26px; height: 1px; background: var(--gold);
    opacity: 0.6;
  }
  .eyebrow.left::after, .eyebrow.right::before { display: none; }

  h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 500; color: var(--ivory); margin: 0; letter-spacing: 0.02em; }
  h1 { font-size: clamp(40px, 6vw, 84px); line-height: 1.05; letter-spacing: 0.06em; }
  h2 { font-size: clamp(30px, 3.4vw, 52px); line-height: 1.1; letter-spacing: 0.06em; }
  h3 { font-size: 22px; letter-spacing: 0.08em; }
  p { margin: 0; }

  .serif-display { font-family: var(--f-script); font-style: italic; font-weight: 400; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--f-display); font-size: 12px; font-weight: 500;
    letter-spacing: 0.32em; text-transform: uppercase;
    padding: 18px 36px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: all .35s ease;
    text-decoration: none;
    position: relative; overflow: hidden;
  }
  .btn::after {
    content: ""; position: absolute; inset: 0;
    background: var(--gold); transform: translateY(101%);
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    z-index: -1;
  }
  .btn:hover { color: var(--bg-0); }
  .btn:hover::after { transform: translateY(0); }
  .btn.solid { background: var(--gold); color: var(--bg-0); }
  .btn.solid:hover { background: transparent; color: var(--gold); }
  .btn.ghost { border-color: var(--line-soft); color: var(--ivory); }
  .btn.ghost:hover { color: var(--bg-0); }
  .btn.ghost::after { background: var(--ivory); }
  .btn .arrow { width: 16px; height: 1px; background: currentColor; position: relative; }
  .btn .arrow::after { content: ""; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border-right: 1px solid currentColor; border-top: 1px solid currentColor; transform: rotate(45deg); }

  /* Divider */
  .divider {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    color: var(--gold); margin: 0 auto;
  }
  .divider .line { width: 80px; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
  .divider .dot { width: 6px; height: 6px; border: 1px solid var(--gold); transform: rotate(45deg); }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: translateY(0); }
  .reveal.delay-1 { transition-delay: .12s; }
  .reveal.delay-2 { transition-delay: .24s; }
  .reveal.delay-3 { transition-delay: .36s; }
  .reveal.delay-4 { transition-delay: .48s; }

  /* Section spacing */
  section { position: relative; padding: 140px 0; }
  section.tight { padding: 96px 0; }

  /* Hero specific styles */
  .hero {
    height: 100vh; min-height: 760px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, #0d1530 0%, #060814 40%, #020205 75%);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .hero-stage {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  .hero-video {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center;
    z-index: 1;
    pointer-events: none;
  }
  .hero-image {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 1;
    pointer-events: none;
  }
  .hero-image + .nebula,
  .hero-image ~ .star-layer { z-index: 2; }
  /* Vignette over the hero image so text stays readable */
  .hero::before {
    content: "";
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 30%, rgba(5,5,5,0.55) 80%, rgba(5,5,5,0.9) 100%),
      linear-gradient(180deg, rgba(5,5,5,0.45) 0%, transparent 25%, transparent 70%, rgba(5,5,5,0.75) 100%);
  }
  /* Hide the placeholder lingam when video is acting as the centerpiece */
  .hero-stage .lingam-placeholder { display: none; }
  .hero-stage .lingam-aura { opacity: 0.5; }
  .nebula {
    position: absolute; inset: -10%;
    background:
      radial-gradient(circle at 30% 40%, rgba(80,130,220,0.18), transparent 45%),
      radial-gradient(circle at 70% 60%, rgba(255, 122, 46,0.10), transparent 50%),
      radial-gradient(circle at 50% 30%, rgba(120,190,255,0.12), transparent 55%);
    filter: blur(40px);
    animation: nebula 22s ease-in-out infinite alternate;
  }
  @keyframes nebula {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(-2%, 1%) scale(1.05); }
  }

  .star-layer {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 65% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 12% 65%, rgba(255,255,255,0.65), transparent),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 35% 15%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 55% 55%, rgba(255,255,255,0.4), transparent);
    background-size: 100% 100%;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: .4; } 100% { opacity: 1; } }

  .orbit {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--line);
    pointer-events: none;
    box-shadow: 0 0 60px rgba(255, 122, 46,0.05) inset;
  }
  .orbit.o1 { width: 580px; height: 580px; animation: spin 80s linear infinite; }
  .orbit.o2 { width: 760px; height: 760px; animation: spin 120s linear infinite reverse; border-color: rgba(120,190,255,0.12); border-style: dashed; }
  .orbit.o3 { width: 940px; height: 940px; animation: spin 160s linear infinite; opacity: 0.5; }
  .orbit.o4 { width: 1180px; height: 1180px; animation: spin 220s linear infinite reverse; opacity: 0.25; border-color: rgba(245,245,245,0.06); }

  .orbit .satellite {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px var(--gold), 0 0 32px var(--gold-glow);
  }
  .orbit .satellite.cyan { background: #8ad0ff; box-shadow: 0 0 14px #8ad0ff, 0 0 32px rgba(120,190,255,0.5); }
  .orbit .satellite.r2 { top: 50%; left: -4px; transform: translateY(-50%); }
  .orbit .satellite.r3 { top: auto; bottom: -4px; left: 50%; transform: translateX(-50%); }

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .lingam-slot {
    position: relative; width: 360px; height: 460px;
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
  }
  .lingam-aura {
    position: absolute; inset: -120px;
    background: radial-gradient(circle, rgba(255, 122, 46,0.28) 0%, rgba(120,190,255,0.18) 25%, transparent 60%);
    filter: blur(20px);
    animation: pulse 5s ease-in-out infinite alternate;
  }
  @keyframes pulse { 0% { opacity: .7; transform: scale(.95); } 100% { opacity: 1; transform: scale(1.04); } }

  /* Lingam placeholder (subtle striped, monospace label) */
  .lingam-placeholder {
    position: relative;
    width: 220px; height: 360px;
    background:
      repeating-linear-gradient(135deg,
        rgba(245,245,245,0.04) 0 8px,
        rgba(245,245,245,0.07) 8px 16px);
    border: 1px solid var(--line);
    border-radius: 110px 110px 12px 12px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 24px;
    box-shadow:
      0 0 80px rgba(255, 122, 46,0.4),
      0 0 200px rgba(120,190,255,0.25),
      inset 0 0 60px rgba(255, 122, 46,0.15);
  }
  .lingam-placeholder::before {
    content: ""; position: absolute; inset: 20px;
    background: radial-gradient(ellipse at 50% 30%, rgba(255, 122, 46,0.18), transparent 60%);
    border-radius: 100px 100px 8px 8px;
  }
  .lingam-placeholder span {
    position: relative; z-index: 2;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.2em;
    color: var(--ivory-faint); text-transform: uppercase;
  }

  /* Floating particles */
  .particles { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .particle {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--gold); opacity: 0;
    box-shadow: 0 0 8px var(--gold-glow);
    animation: float linear infinite;
  }
  @keyframes float {
    0% { opacity: 0; transform: translateY(0) translateX(0); }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-180px) translateX(var(--drift, 30px)); }
  }

  /* Hero content overlay */
  .hero-content {
    position: relative; z-index: 5;
    text-align: center;
    pointer-events: none;
  }
  .hero-content > * { pointer-events: auto; }
  .hero-title {
    font-family: var(--f-display); font-weight: 500;
    font-size: clamp(40px, 5.8vw, 84px);
    letter-spacing: 0.14em;
    line-height: 1; margin: 0;
    text-shadow: 0 0 40px rgba(255, 122, 46,0.4);
  }
  .hero-title .om {
    display: block; font-family: var(--f-script); font-style: italic; font-weight: 400;
    font-size: clamp(22px, 2vw, 30px); color: var(--gold);
    letter-spacing: 0.4em; margin-bottom: 14px;
    text-transform: uppercase;
  }
  .hero-title .glow { color: var(--gold); }
  .hero-sub {
    margin-top: 28px;
    font-family: var(--f-script); font-style: italic;
    font-size: clamp(18px, 1.5vw, 22px);
    color: var(--ivory-dim);
    max-width: 620px; margin-left: auto; margin-right: auto;
    line-height: 1.5;
  }
  .hero-meta {
    position: absolute; left: 48px; right: 48px; bottom: 48px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.28em;
    color: var(--ivory-faint); text-transform: uppercase;
    z-index: 6;
  }
  .hero-meta .scroll {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .hero-meta .scroll .line {
    width: 1px; height: 40px; background: linear-gradient(to bottom, var(--gold), transparent);
    animation: drop 2s ease-in-out infinite;
  }
  @keyframes drop { 0%, 100% { transform: scaleY(.5); transform-origin: top; opacity: .6; } 50% { transform: scaleY(1); opacity: 1; } }

  /* Top nav */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 22px 48px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    transition: background .4s ease, border-color .4s ease, backdrop-filter .4s ease;
    border-bottom: 1px solid transparent;
  }
  .nav.scrolled {
    background: rgba(5,5,5,0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom-color: var(--line-soft);
  }
  .nav-mark {
    display: flex; align-items: center; gap: 14px;
    font-family: var(--f-display); font-size: 13px; letter-spacing: 0.22em; color: var(--ivory);
    text-transform: uppercase;
  }
  .nav-mark .sigil {
    width: 36px; height: 36px; border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--f-script); font-style: italic; color: var(--gold); font-size: 18px;
    border-radius: 50%;
  }
  .nav-mark .sub {
    display: block; font-family: var(--f-script); font-style: italic;
    font-size: 11px; letter-spacing: 0.06em; color: var(--ivory-faint);
    text-transform: none;
    margin-top: 2px;
  }
  .nav-links { display: flex; gap: 36px; justify-content: center; }
  .nav-links a {
    font-family: var(--f-display); font-size: 11px; letter-spacing: 0.28em;
    color: var(--ivory-dim); text-decoration: none; text-transform: uppercase;
    transition: color .25s ease; position: relative;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-links a.active { color: var(--gold); }
  .nav-cta { display: flex; justify-content: flex-end; gap: 14px; align-items: center; }
  .nav-cta .ico {
    width: 36px; height: 36px; border: 1px solid var(--line-soft); display: grid; place-items: center;
    color: var(--ivory-dim); cursor: pointer; transition: all .3s;
  }
  .nav-cta .ico:hover { color: var(--gold); border-color: var(--gold); }
  .nav-cta .mini-btn {
    font-family: var(--f-display); font-size: 11px; letter-spacing: 0.28em;
    color: var(--bg-0); background: var(--gold); border: 1px solid var(--gold);
    padding: 12px 22px; text-transform: uppercase; cursor: pointer;
    transition: all .3s ease;
  }
  .nav-cta .mini-btn:hover { background: transparent; color: var(--gold); }

  /* Cards */
  .card {
    background: linear-gradient(180deg, rgba(20, 26, 44, 0.55), rgba(11, 17, 32, 0.4));
    border: 1px solid var(--line-soft);
    padding: 36px;
    position: relative;
    transition: border-color .4s ease, transform .5s ease;
  }
  .card:hover { border-color: var(--gold); }
  .card::before, .card::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 1px solid var(--gold); opacity: 0.45;
  }
  .card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* User-fillable image slot styling override */
  image-slot {
    display: block; width: 100%; height: 100%;
    border: 1px solid var(--line-soft);
    background: repeating-linear-gradient(45deg,
      rgba(245,245,245,0.03) 0 10px,
      rgba(245,245,245,0.06) 10px 20px);
  }

  /* Image placeholders */
  .img-ph {
    position: relative;
    background:
      repeating-linear-gradient(45deg,
        rgba(245,245,245,0.03) 0 10px,
        rgba(245,245,245,0.06) 10px 20px);
    border: 1px solid var(--line-soft);
    display: grid; place-items: center;
    color: var(--ivory-faint);
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    overflow: hidden;
  }
  .img-ph::before {
    content: ""; position: absolute; inset: 12px; border: 1px solid var(--line);
    opacity: 0.4;
  }
  .img-ph .label { position: relative; padding: 6px 12px; background: rgba(5,5,5,0.7); border: 1px solid var(--line); }

  /* Footer */
  footer { padding: 100px 0 40px; border-top: 1px solid var(--line-soft); background: linear-gradient(180deg, transparent, rgba(11,17,32,0.5)); }

  /* Inputs */
  input, select, textarea {
    width: 100%;
    background: rgba(245,245,245,0.03);
    border: 1px solid var(--line-soft);
    color: var(--ivory);
    font-family: var(--f-serif); font-size: 16px;
    padding: 16px 18px;
    outline: none;
    transition: border-color .25s ease, background .25s ease;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); background: rgba(255, 122, 46,0.04); }
  label.field-label {
    display: block;
    font-family: var(--f-display); font-size: 10px; letter-spacing: 0.28em;
    color: var(--ivory-faint); text-transform: uppercase; margin-bottom: 10px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.78); backdrop-filter: blur(8px);
    display: grid; place-items: center;
    padding: 32px;
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: linear-gradient(180deg, #0d1428, #060814);
    border: 1px solid var(--line);
    max-width: 720px; width: 100%; max-height: 92vh; overflow-y: auto;
    position: relative;
    padding: 56px;
    animation: lift .5s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes lift { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .modal-close {
    position: absolute; top: 20px; right: 20px;
    width: 40px; height: 40px; border: 1px solid var(--line-soft);
    background: transparent; color: var(--ivory); cursor: pointer;
    font-family: var(--f-script); font-size: 22px;
    transition: all .3s;
  }
  .modal-close:hover { border-color: var(--gold); color: var(--gold); }

  /* Bookmark/sticky CTA */
  .sticky-orb {
    position: fixed; bottom: 32px; right: 32px; z-index: 40;
    width: 70px; height: 70px; border-radius: 50%;
    background: var(--gold); color: var(--bg-0);
    border: none; cursor: pointer;
    display: grid; place-items: center;
    font-family: var(--f-display); font-size: 9px; letter-spacing: 0.2em;
    box-shadow: 0 0 30px rgba(255, 122, 46,0.5);
    animation: orbPulse 2.5s ease-in-out infinite;
    transition: transform .3s ease;
  }
  .sticky-orb:hover { transform: scale(1.08); }
  @keyframes orbPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 122, 46,0.5); }
    50% { box-shadow: 0 0 50px rgba(255, 122, 46,0.9), 0 0 80px rgba(255, 122, 46,0.3); }
  }

  /* Loader */
  .loader {
    position: fixed; inset: 0; z-index: 200; background: #020205;
    display: grid; place-items: center;
    transition: opacity .9s ease, visibility .9s;
  }
  .loader.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-mark {
    text-align: center; color: var(--gold);
  }
  .loader-mark .ring {
    width: 110px; height: 110px; border-radius: 50%;
    border: 1px solid var(--line);
    border-top-color: var(--gold);
    margin: 0 auto 24px;
    animation: spin 1.6s linear infinite;
    position: relative;
  }
  .loader-mark .ring::before {
    content: ""; position: absolute; inset: 14px; border: 1px solid var(--line);
    border-right-color: var(--gold); border-radius: 50%;
    animation: spin 2.2s linear infinite reverse;
  }
  .loader-mark .ring::after {
    content: "ॐ"; position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--f-sanskrit); font-size: 36px; color: var(--gold);
  }
  .loader-mark .text { font-family: var(--f-display); font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--ivory-dim); }

  /* Misc */
  /* Festival horizontal scroll — hidden scrollbar, arrow-controlled */
  .festival-scroll {
    scrollbar-width: none;
  }
  .festival-scroll::-webkit-scrollbar {
    display: none;
    height: 0;
    width: 0;
  }

  .marquee {
    overflow: hidden; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
    padding: 22px 0; background: rgba(11,17,32,0.4);
  }
  .marquee-track { display: flex; gap: 80px; animation: scrollX 50s linear infinite; white-space: nowrap; }
  @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-item { display: inline-flex; align-items: center; gap: 16px; font-family: var(--f-script); font-style: italic; font-size: 22px; color: var(--ivory-dim); }
